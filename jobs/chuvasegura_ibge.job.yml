# Job do IBGE: setores censitários do Censo 2022 com pessoas e domicílios, da landing até a Gold.
# O Censo é um retrato de 2022: a landing só baixa de novo se o arquivo mudar no IBGE, então a agenda mensal é barata.
# A qualidade da Silver barra a Gold.
resources:
  jobs:
    ChuvaSegura_IBGE:
      name: ChuvaSegura - IBGE
      schedule:
        quartz_cron_expression: "0 30 6 1 * ?"
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      tasks:
        - task_key: ibge_census_tracts_landing
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/src/ibge/ingestion/01_ibge_census_tracts_landing
            source: WORKSPACE
        - task_key: ibge_census_tracts_bronze
          depends_on:
            - task_key: ibge_census_tracts_landing
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/src/ibge/transformations/bronze/02_ibge_census_tracts_bronze
            source: WORKSPACE
        - task_key: ibge_census_tracts_silver
          depends_on:
            - task_key: ibge_census_tracts_bronze
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/src/ibge/transformations/silver/03_ibge_census_tracts_silver
            source: WORKSPACE
        - task_key: quality_silver_ibge
          depends_on:
            - task_key: ibge_census_tracts_silver
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/src/ibge/quality/03_ibge_silver_quality
            source: WORKSPACE
        - task_key: dim_ibge_census_tracts
          depends_on:
            - task_key: quality_silver_ibge
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/src/ibge/transformations/gold/04_dim_ibge_census_tracts
            source: WORKSPACE
        - task_key: dim_tempo
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/src/shared/transformations/gold/00_dim_tempo
            source: WORKSPACE
        - task_key: gold_ibge_census_tract_population
          depends_on:
            - task_key: dim_ibge_census_tracts
            - task_key: dim_tempo
            - task_key: quality_silver_ibge
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/src/ibge/transformations/gold/05_fact_ibge_census_tract_population
            source: WORKSPACE
        - task_key: quality_gold_ibge
          depends_on:
            - task_key: gold_ibge_census_tract_population
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/src/ibge/quality/05_ibge_gold_quality
            source: WORKSPACE
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
