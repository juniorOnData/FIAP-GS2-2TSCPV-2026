# Job do OpenStreetMap: rede viária do município de São Paulo (extrato da Geofabrik), da landing até a Gold.
# A Geofabrik publica um extrato novo por dia; a rede muda pouco de uma semana para outra, então a agenda é semanal.
# A qualidade da Silver barra a Gold. Dados © OpenStreetMap contributors, ODbL 1.0.
resources:
  jobs:
    ChuvaSegura_OSM:
      name: ChuvaSegura - OSM
      schedule:
        quartz_cron_expression: "0 0 5 ? * MON"
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      tasks:
        - task_key: osm_roads_landing
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/src/osm/ingestion/01_osm_roads_landing
            source: WORKSPACE
        - task_key: osm_roads_bronze
          depends_on:
            - task_key: osm_roads_landing
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/src/osm/transformations/bronze/02_osm_roads_bronze
            source: WORKSPACE
        - task_key: osm_roads_silver
          depends_on:
            - task_key: osm_roads_bronze
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/src/osm/transformations/silver/03_osm_roads_silver
            source: WORKSPACE
        - task_key: quality_silver_osm
          depends_on:
            - task_key: osm_roads_silver
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/src/osm/quality/03_osm_silver_quality
            source: WORKSPACE
        - task_key: dim_osm_road_class
          depends_on:
            - task_key: quality_silver_osm
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/src/osm/transformations/gold/04_dim_osm_road_class
            source: WORKSPACE
        - task_key: dim_osm_roads
          depends_on:
            - task_key: dim_osm_road_class
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/src/osm/transformations/gold/05_dim_osm_roads
            source: WORKSPACE
        - task_key: quality_gold_osm
          depends_on:
            - task_key: dim_osm_roads
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/src/osm/quality/05_osm_gold_quality
            source: WORKSPACE
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
