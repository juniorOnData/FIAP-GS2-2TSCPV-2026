# Job do SIBH: cadastro de sensores e medições de chuva e nível, da landing até a Gold.
# A coleta das medições usa o cadastro da Bronze. A qualidade da Silver barra a Gold.
# Sem agenda própria: roda dentro do job ChuvaSegura (chuvasegura.job.yml), depois da dim_tempo.
resources:
  jobs:
    ChuvaSegura_SIBH:
      name: ChuvaSegura - SIBH
      tasks:
        - task_key: sibh_stations_landing
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/sibh/ingestion/01_sibh_stations_landing
            source: WORKSPACE
        - task_key: sibh_stations_bronze
          depends_on:
            - task_key: sibh_stations_landing
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/sibh/transformations/bronze/02_sibh_stations_bronze
            base_parameters:
              snapshot_date: pending
            source: WORKSPACE
        - task_key: sibh_measurements_landing
          depends_on:
            - task_key: sibh_stations_bronze
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/sibh/ingestion/03_sibh_measurements_landing
            base_parameters:
              mode: incremental
            source: WORKSPACE
        - task_key: sibh_measurements_bronze
          depends_on:
            - task_key: sibh_measurements_landing
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/sibh/transformations/bronze/04_sibh_measurements_bronze
            base_parameters:
              window: pending
            source: WORKSPACE
        - task_key: sibh_stations_silver
          depends_on:
            - task_key: sibh_stations_bronze
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/sibh/transformations/silver/05_sibh_stations_silver
            source: WORKSPACE
        - task_key: sibh_measurements_silver
          depends_on:
            - task_key: sibh_measurements_bronze
            - task_key: sibh_stations_silver
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/sibh/transformations/silver/05_sibh_measurements_silver
            base_parameters:
              window: pending
            source: WORKSPACE
        - task_key: quality_silver_sibh
          depends_on:
            - task_key: sibh_stations_silver
            - task_key: sibh_measurements_silver
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/sibh/quality/05_sibh_silver_quality
            source: WORKSPACE
        - task_key: dim_sibh_sensors
          depends_on:
            - task_key: quality_silver_sibh
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/sibh/transformations/gold/06_dim_sibh_sensors
            source: WORKSPACE
        - task_key: gold_sibh_rainfall_hourly
          depends_on:
            - task_key: dim_sibh_sensors
            - task_key: quality_silver_sibh
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/sibh/transformations/gold/07_fact_sibh_rainfall_hourly
            source: WORKSPACE
        - task_key: gold_sibh_level_hourly
          depends_on:
            - task_key: dim_sibh_sensors
            - task_key: quality_silver_sibh
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/sibh/transformations/gold/07_fact_sibh_level_hourly
            source: WORKSPACE
        - task_key: quality_gold_sibh
          depends_on:
            - task_key: gold_sibh_rainfall_hourly
            - task_key: gold_sibh_level_hourly
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/sibh/quality/07_sibh_gold_quality
            source: WORKSPACE
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
