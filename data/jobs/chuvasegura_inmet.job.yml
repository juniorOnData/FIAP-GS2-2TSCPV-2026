# Job do INMET: dados meteorológicos horários das estações automáticas do município de São Paulo, da landing até a Gold.
# O INMET atualiza o zip do ano corrente mais ou menos uma vez por mês; a landing só baixa de novo quando o zip muda,
# então a agenda semanal é barata. A qualidade da Silver barra a Gold.
resources:
  jobs:
    ChuvaSegura_INMET:
      name: ChuvaSegura - INMET
      schedule:
        quartz_cron_expression: "0 0 8 ? * MON"
        timezone_id: America/Sao_Paulo
        pause_status: PAUSED
      tasks:
        - task_key: inmet_weather_landing
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/inmet/ingestion/01_inmet_weather_landing
            base_parameters:
              modo: incremental
            source: WORKSPACE
        - task_key: inmet_weather_bronze
          depends_on:
            - task_key: inmet_weather_landing
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/inmet/transformations/bronze/02_inmet_weather_bronze
            source: WORKSPACE
        - task_key: inmet_stations_silver
          depends_on:
            - task_key: inmet_weather_bronze
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/inmet/transformations/silver/03_inmet_stations_silver
            source: WORKSPACE
        - task_key: inmet_weather_readings_silver
          depends_on:
            - task_key: inmet_weather_bronze
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/inmet/transformations/silver/03_inmet_weather_readings_silver
            base_parameters:
              window: pending
            source: WORKSPACE
        - task_key: quality_silver_inmet
          depends_on:
            - task_key: inmet_stations_silver
            - task_key: inmet_weather_readings_silver
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/inmet/quality/03_inmet_silver_quality
            source: WORKSPACE
        - task_key: dim_inmet_stations
          depends_on:
            - task_key: quality_silver_inmet
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/inmet/transformations/gold/04_dim_inmet_stations
            source: WORKSPACE
        - task_key: dim_tempo
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/shared/transformations/gold/00_dim_tempo
            source: WORKSPACE
        - task_key: gold_inmet_weather_hourly
          depends_on:
            - task_key: dim_inmet_stations
            - task_key: dim_tempo
            - task_key: quality_silver_inmet
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/inmet/transformations/gold/05_fact_inmet_weather_hourly
            source: WORKSPACE
        - task_key: quality_gold_inmet
          depends_on:
            - task_key: gold_inmet_weather_hourly
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/inmet/quality/05_inmet_gold_quality
            source: WORKSPACE
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
