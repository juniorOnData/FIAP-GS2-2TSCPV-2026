# Job do GeoSampa: ocorrências históricas e subprefeituras, da Bronze até a Gold.
# A qualidade da Silver barra a Gold.
# Sem agenda própria: roda dentro do job ChuvaSegura (chuvasegura.job.yml), depois da dim_tempo.
resources:
  jobs:
    ChuvaSegura_GeoSampa:
      name: ChuvaSegura - GeoSampa
      tasks:
        - task_key: ingestion_history_flooding_events
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/geosampa/ingestion/01_geosampa_history_flooding_events_bronze
            source: WORKSPACE
          environment_key: Default
        - task_key: ingestion_subprefecture_area
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/geosampa/ingestion/01_geosampa_subprefecture_area_bronze
            source: WORKSPACE
        - task_key: ingestion_subprefecture_limits
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/geosampa/ingestion/01_geosampa_subprefecture_limits_bronze
            source: WORKSPACE
        - task_key: silver_geosampa_flooding_events
          depends_on:
            - task_key: ingestion_history_flooding_events
            - task_key: ingestion_subprefecture_area
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/geosampa/transformations/silver/02_geosampa_flooding_events_silver
            source: WORKSPACE
        - task_key: quality_silver_geosampa
          depends_on:
            - task_key: silver_geosampa_flooding_events
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/geosampa/quality/02_geosampa_silver_quality
            source: WORKSPACE
        - task_key: dim_geosampa_subprefecture_area
          depends_on:
            - task_key: ingestion_subprefecture_area
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/geosampa/transformations/gold/03_dim_geosampa_subprefecture_area
            source: WORKSPACE
        - task_key: dim_geosampa_type_flooding_events
          depends_on:
            - task_key: quality_silver_geosampa
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/geosampa/transformations/gold/03_dim_geosampa_type_flooding_events
            source: WORKSPACE
        - task_key: gold_geosampa_flooding_events
          depends_on:
            - task_key: dim_geosampa_type_flooding_events
            - task_key: dim_geosampa_subprefecture_area
            - task_key: quality_silver_geosampa
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/geosampa/transformations/gold/04_fact_geosampa_flooding_events
            source: WORKSPACE
        - task_key: dim_geosampa_subprefecture_limits
          depends_on:
            - task_key: dim_geosampa_subprefecture_area
            - task_key: ingestion_subprefecture_limits
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/geosampa/transformations/gold/03_dim_geosampa_subprefecture_limits
            source: WORKSPACE
        - task_key: quality_gold_geosampa
          depends_on:
            - task_key: gold_geosampa_flooding_events
            - task_key: dim_geosampa_subprefecture_limits
          notebook_task:
            notebook_path: /Workspace/Users/rm562679@fiap.com.br/FIAP-GS2-2TSCPV-2026/data/src/geosampa/quality/04_geosampa_gold_quality
            source: WORKSPACE
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
